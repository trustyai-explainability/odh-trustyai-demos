[project]
name = "image-mmd-kserve-demo"
version = "0.1.0"
description = "Local and KServe image drift demo using TrustyAI MMD"
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy==2.5.3",
    "Pillow==12.3.0",
]

[project.optional-dependencies]
local = [
    "ipykernel",
    "jupyterlab",
    "matplotlib",
    "pandas>=3.0,<4",
    "nbconvert",
]

[tool.uv]
package = false
